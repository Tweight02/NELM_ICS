<div class="mx-auto max-w-2xl px-4 sm:px-6 py-8 space-y-5">

    <!-- Breadcrumb -->
    <nav aria-label="Breadcrumb">
        <ol class="flex items-center text-xs font-semibold uppercase tracking-wide">
            <li class="text-slate-400">Church Representative</li>
            <li class="mx-2 text-slate-300">/</li>
            <li>
                <a routerLink="../" class="text-slate-400 hover:text-emerald-700">Events</a>
            </li>
            <li class="mx-2 text-slate-300">/</li>
            <li class="text-emerald-700">Create</li>
        </ol>
    </nav>

    <div class="rounded-xl border border-gray-200 bg-white shadow-sm">

        <!-- Header -->
        <div class="border-b border-gray-200 px-6 py-5">
            <h1 class="font-serif text-2xl font-bold text-gray-900">Create event</h1>
            <p class="mt-1 text-sm text-gray-500">Add a new event to the church calendar.</p>
        </div>

        <form [formGroup]="eventForm" (ngSubmit)="saveEvent()" novalidate class="space-y-5 px-6 py-6">

            <!-- Title -->
            <div class="space-y-1.5">
                <label for="title" class="block text-sm font-semibold text-gray-700">
                    Title <span class="text-rose-500">*</span>
                </label>
                <input type="text" id="title" formControlName="title" placeholder="e.g. Sabbath School Training"
                    class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm transition focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
                <p *ngIf="eventForm.get('title')?.invalid && eventForm.get('title')?.touched"
                    class="text-xs text-rose-600">
                    Please enter an event title.
                </p>
            </div>

            <!-- Dates -->
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
                <div class="space-y-1.5">
                    <label for="date_start" class="block text-sm font-semibold text-gray-700">
                        Start date <span class="text-rose-500">*</span>
                    </label>
                    <input type="date" id="date_start" formControlName="date_start"
                        class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm transition focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
                    <p *ngIf="eventForm.get('date_start')?.invalid && eventForm.get('date_start')?.touched"
                        class="text-xs text-rose-600">
                        Choose a start date.
                    </p>
                </div>

                <div class="space-y-1.5">
                    <label for="date_end" class="block text-sm font-semibold text-gray-700">
                        End date <span class="text-rose-500">*</span>
                    </label>
                    <input type="date" id="date_end" formControlName="date_end"
                        [attr.min]="eventForm.get('date_start')?.value || null"
                        class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm transition focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
                    <p *ngIf="eventForm.get('date_end')?.invalid && eventForm.get('date_end')?.touched"
                        class="text-xs text-rose-600">
                        Choose an end date.
                    </p>
                </div>
            </div>

            <!-- Time -->
            <div class="space-y-1.5 sm:w-1/2 sm:pr-2.5">
                <label for="time" class="block text-sm font-semibold text-gray-700">Start time</label>
                <input type="time" id="time" formControlName="time"
                    class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-900 shadow-sm transition focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
            </div>

            <!-- Address -->
            <div class="space-y-1.5">
                <label for="address" class="block text-sm font-semibold text-gray-700">Location</label>
                <input type="text" id="address" formControlName="address" placeholder="e.g. Church"
                    class="w-full rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm transition focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100" />
            </div>

            <!-- Description -->
            <div class="space-y-1.5">
                <label for="description" class="block text-sm font-semibold text-gray-700">Description</label>
                <textarea id="description" formControlName="description" rows="4"
                    placeholder="What should people know about this event?"
                    class="w-full resize-none rounded-lg border border-gray-300 bg-white px-3.5 py-2.5 text-sm text-gray-900 placeholder-gray-400 shadow-sm transition focus:border-emerald-600 focus:outline-none focus:ring-2 focus:ring-emerald-100"></textarea>
            </div>

            <!-- Actions -->
            <div class="flex items-center justify-end gap-3 border-t border-gray-200 pt-5">
                <a routerLink="../"
                    class="rounded-lg border border-gray-200 px-4 py-2.5 text-sm font-semibold text-gray-700 transition hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit"
                    class="rounded-lg bg-emerald-900 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-emerald-800 focus:outline-none focus:ring-2 focus:ring-emerald-200">
                    Create event
                </button>
            </div>

        </form>
    </div>
</div>
