<div class="max-w-2xl mx-auto px-6 py-10">

    <div class="mb-6">
        <h1 class="font-display text-2xl font-medium">Create event</h1>
        <p class="text-muted text-sm mt-1">Add a new event to the calendar.</p>
    </div>

    <form [formGroup]="eventForm" (submit)="saveEvent()"  class="bg-surface border border-hairline rounded-lg p-6 flex flex-col gap-5">

        <!-- Title -->
        <div class="flex flex-col gap-1.5">
            <label for="title" class="text-sm font-medium text-ivory">Title</label>
            <input type="text" id="title" formControlName="title" placeholder="e.g. Marra & The Overflow"
                class="bg-surfaceRaised border border-hairline rounded-md px-3 py-2 text-sm text-ivory placeholder-faint focus:outline-none focus:border-concert" />
        </div>

        <!-- Date start / Date end -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div class="flex flex-col gap-1.5">
                <label for="date_start" class="text-sm font-medium text-ivory">Start date</label>
                <input type="date" id="date_start" formControlName="date_start"
                    class="bg-surfaceRaised border border-hairline rounded-md px-3 py-2 text-sm text-ivory focus:outline-none focus:border-concert" />
            </div>

            <div class="flex flex-col gap-1.5">
                <label for="date_end" class="text-sm font-medium text-ivory">End date</label>
                <input type="date" id="date_end" formControlName="date_end"
                    class="bg-surfaceRaised border border-hairline rounded-md px-3 py-2 text-sm text-ivory focus:outline-none focus:border-concert" />
            </div>
        </div>

        <!-- Time -->
        <div class="flex flex-col gap-1.5">
            <label for="time" class="text-sm font-medium text-ivory">Time Start</label>
            <input type="time" id="time" formControlName="time"
                class="bg-surfaceRaised border border-hairline rounded-md px-3 py-2 text-sm text-ivory focus:outline-none focus:border-concert" />
        </div>

        <!-- Address -->
        <div class="flex flex-col gap-1.5">
            <label for="address" class="text-sm font-medium text-ivory">Address</label>
            <input type="text" id="address" formControlName="address" placeholder="e.g. Main Hall, 12 Wharf Street"
                class="bg-surfaceRaised border border-hairline rounded-md px-3 py-2 text-sm text-ivory placeholder-faint focus:outline-none focus:border-concert" />
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-1.5">
            <label for="description" class="text-sm font-medium text-ivory">Description</label>
            <textarea id="description" formControlName="description" rows="4"
                placeholder="What should people know about this event?"
                class="bg-surfaceRaised border border-hairline rounded-md px-3 py-2 text-sm text-ivory placeholder-faint focus:outline-none focus:border-concert resize-none"></textarea>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-3 pt-2">
            <a routerLink="../">
                <button type="button"
                    class="px-4 py-2 rounded-md text-sm font-medium text-muted hover:text-ivory transition-colors">
                    Cancel
                </button>
            </a>
            <button type="submit"
                class="px-4 py-2 rounded-md text-sm font-semibold text-ink bg-concert hover:opacity-90 transition-opacity">
                Create event
            </button>
        </div>

    </form>
</div>
